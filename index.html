<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Belajar Bersama Ubay!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Baloo 2',cursive;background:#FFF9F0;min-height:100vh;overflow-x:hidden}

/* BUBBLES */
.bubbles{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bbl{position:absolute;border-radius:50%;opacity:0.12;animation:fbl 10s ease-in-out infinite}
.bbl:nth-child(1){width:360px;height:360px;background:#FF6B6B;top:-90px;left:-90px;animation-delay:0s}
.bbl:nth-child(2){width:280px;height:280px;background:#4ECDC4;top:18%;right:-70px;animation-delay:2.5s}
.bbl:nth-child(3){width:220px;height:220px;background:#FFD93D;bottom:2%;left:8%;animation-delay:5s}
.bbl:nth-child(4){width:180px;height:180px;background:#A78BFA;bottom:-50px;right:18%;animation-delay:1s}
.bbl:nth-child(5){width:150px;height:150px;background:#FF9A9E;top:52%;left:2%;animation-delay:3.5s}
@keyframes fbl{0%,100%{transform:translate(0,0)scale(1)}40%{transform:translate(22px,-26px)scale(1.07)}70%{transform:translate(-14px,18px)scale(0.95)}}

/* SCREENS */
.screen{display:none;position:relative;z-index:10;min-height:100vh}
.screen.active{display:block}

/* ══ SPLASH ══ */
#splash{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;padding:20px;gap:8px;
  background:linear-gradient(160deg,#FFE5F1 0%,#E8F4FF 45%,#FFFDE7 100%);
  position:relative;z-index:10;
}
.sp-stars{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sstar{position:absolute;animation:twinkle 2s ease-in-out infinite;font-size:1.2rem}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.sp-title{font-family:'Fredoka One',cursive;font-size:clamp(1.4rem,6vw,2.2rem);color:#E91E8C;text-align:center;animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both;text-shadow:2px 2px 0 rgba(0,0,0,.07);z-index:1}
.sp-photo{width:clamp(140px,40vw,200px);border-radius:50%;border:6px solid white;box-shadow:0 12px 40px rgba(0,0,0,.16);display:block;object-fit:cover;aspect-ratio:1;animation:popIn .7s .15s cubic-bezier(.34,1.56,.64,1) both;z-index:1}
.sp-tag{font-family:'Fredoka One',cursive;font-size:clamp(.85rem,3vw,1.1rem);color:#5D4037;text-align:center;animation:fadeUp .6s .3s ease both;z-index:1}
.sp-choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:500px;animation:fadeUp .6s .45s ease both;z-index:5;position:relative}
.sp-btn{
  flex:1;min-width:130px;max-width:160px;
  border:none;border-radius:24px;padding:14px 8px 16px;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:0 8px 24px rgba(0,0,0,.13),0 4px 0 rgba(0,0,0,.09);
  border:4px solid rgba(255,255,255,.55);transition:transform .12s;
  animation:cardPop .5s cubic-bezier(.34,1.56,.64,1) both;
  position:relative;z-index:5;
}
.sp-btn:active{transform:scale(.93)translateY(3px)}
.sp-btn.abc{background:linear-gradient(145deg,#FF6B6B,#FF9A9E);animation-delay:.5s}
.sp-btn.hij{background:linear-gradient(145deg,#388E3C,#66BB6A);animation-delay:.62s}
.sp-btn.toy{background:linear-gradient(145deg,#7B2FBE,#AB47BC);animation-delay:.74s}
.sp-btn-icon{font-size:clamp(2.5rem,9vw,3.5rem);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.sp-btn-title{font-family:'Fredoka One',cursive;font-size:clamp(1rem,4vw,1.4rem);color:white;text-shadow:2px 3px 0 rgba(0,0,0,.13)}
.sp-btn-sub{font-size:clamp(.6rem,2vw,.75rem);color:rgba(255,255,255,.9);font-weight:800}
@keyframes cardPop{from{transform:scale(.3)rotate(-8deg);opacity:0}to{transform:scale(1)rotate(0);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

/* ══ APP SCREEN ══ */
#appScreen{padding-bottom:40px}
.app-header{text-align:center;padding:10px 16px 2px;position:relative}
.back-btn{
  position:absolute;top:10px;left:14px;
  background:white;border:3px solid #E9D5FF;border-radius:99px;
  padding:5px 14px;font-family:'Fredoka One',cursive;font-size:.85rem;
  color:#A78BFA;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08);
  transition:transform .12s;
}
.back-btn:active{transform:scale(.92)}
.app-mascot{font-size:1.5rem;display:inline-block;animation:wob 2s ease-in-out infinite;vertical-align:middle}
@keyframes wob{0%,100%{transform:rotate(-9deg)translateY(0)}50%{transform:rotate(9deg)translateY(-6px)}}
.app-title{font-family:'Fredoka One',cursive;font-size:clamp(1.1rem,4.5vw,1.7rem);color:#2D2D2D;display:inline}
.app-sub{font-size:clamp(.68rem,2.2vw,.84rem);font-weight:700;margin-top:1px;text-align:center}
.app-sub.abc{color:#FF6B6B}.app-sub.hij{color:#388E3C}.app-sub.toy{color:#7B2FBE}

/* PROGRESS */
.prog-wrap{display:flex;align-items:center;gap:10px;padding:4px 18px;max-width:460px;margin:0 auto}
.star-badge{font-family:'Fredoka One',cursive;font-size:1rem;color:#F59E0B;background:#FFF3CD;border-radius:99px;padding:2px 10px;border:3px solid #FFD93D;white-space:nowrap}
.prog-track{flex:1;height:12px;border-radius:99px;overflow:hidden;border:3px solid}
.prog-track.abc{background:#FFE0E0;border-color:#FFAAA5}.prog-track.hij{background:#C8E6C9;border-color:#A5D6A7}.prog-track.toy{background:#EDE7F6;border-color:#CE93D8}
.prog-fill{height:100%;border-radius:99px;transition:width .7s cubic-bezier(.34,1.56,.64,1);width:0%}
.prog-fill.abc{background:linear-gradient(90deg,#FF6B6B,#FF9A9E)}.prog-fill.hij{background:linear-gradient(90deg,#66BB6A,#26A69A)}.prog-fill.toy{background:linear-gradient(90deg,#AB47BC,#7B1FA2)}

/* LETTER GRID LAYOUT */
.letter-stage{display:flex;flex-direction:column;align-items:center;padding:4px 12px 0;position:relative;z-index:10}
.center-stage{width:min(94vw,500px);position:relative}
.letter-cols{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;width:100%}
.col-l,.col-r{display:flex;flex-direction:column;gap:7px}
.col-c{flex-shrink:0;width:clamp(88px,23vw,136px)}
.ubay-mid{width:100%}
.ubay-mid img{width:100%;border-radius:50%;border:5px solid white;box-shadow:0 8px 28px rgba(0,0,0,.16);display:block;object-fit:cover;aspect-ratio:1}

/* SIDE CARDS */
.lcard{
  border-radius:18px;padding:10px 9px;display:flex;align-items:center;gap:8px;
  cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12),0 2px 12px rgba(0,0,0,.08);
  border:3px solid rgba(255,255,255,.45);transition:transform .1s;
  user-select:none;position:relative;
  animation:cardIn .4s cubic-bezier(.34,1.56,.64,1) both;
}
.lcard:active{transform:scale(.93)}
.lcard.done::after{content:'⭐';position:absolute;top:-6px;right:-4px;font-size:.8rem}
.col-r .lcard{flex-direction:row-reverse}
.lcard .emoji{font-size:clamp(2rem,7vw,2.8rem);line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.15));flex-shrink:0}
.lcard .ltr{font-family:'Fredoka One',cursive;font-size:clamp(1.3rem,5vw,1.9rem);color:white;text-shadow:2px 3px 0 rgba(0,0,0,.13);line-height:1}
.lcard .wrd{font-size:clamp(.58rem,1.9vw,.76rem);font-weight:800;color:rgba(255,255,255,.88);text-transform:uppercase;letter-spacing:.8px;margin-top:1px}
.col-r .lcard .info{text-align:right}
.lcard .arab{font-size:clamp(2.3rem,8vw,3.2rem);line-height:1;color:white;text-shadow:3px 5px 0 rgba(0,0,0,.18);font-family:serif;flex-shrink:0}
.lcard .aname{font-family:'Fredoka One',cursive;font-size:clamp(.62rem,2vw,.8rem);color:rgba(255,255,255,.92);letter-spacing:.5px;text-transform:uppercase}
.col-r .lcard .ainfo{text-align:right}
@keyframes cardIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}

/* BOTTOM ROW */
.bottom-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding:7px 10px 10px;max-width:520px;margin:0 auto;position:relative;z-index:10}
.bcard{
  border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;
  cursor:pointer;min-width:50px;box-shadow:0 4px 0 rgba(0,0,0,.12),0 2px 10px rgba(0,0,0,.07);
  border:3px solid rgba(255,255,255,.42);transition:transform .1s;user-select:none;position:relative;
}
.bcard:active{transform:scale(.9)}
.bcard.done::after{content:'⭐';position:absolute;top:-5px;right:-3px;font-size:.55rem}
.bcard .emoji{font-size:clamp(1.4rem,4.5vw,1.9rem);line-height:1;filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.bcard .ltr{font-family:'Fredoka One',cursive;font-size:clamp(.95rem,3.5vw,1.35rem);color:white;text-shadow:2px 2px 0 rgba(0,0,0,.12)}
.bcard .arab{font-size:clamp(1.5rem,5vw,2rem);line-height:1;color:white;text-shadow:2px 3px 0 rgba(0,0,0,.15);font-family:serif}
.bcard .aname{font-size:clamp(.48rem,1.6vw,.62rem);color:rgba(255,255,255,.9);font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-top:1px}

.tap-hint{font-size:clamp(.66rem,2vw,.8rem);font-weight:700;margin-top:6px;animation:pulse 2s ease-in-out infinite;text-align:center;position:relative;z-index:10}
.tap-hint.abc{color:#FFAAA5}.tap-hint.hij{color:#A5D6A7}.tap-hint.toy{color:#CE93D8}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

/* THOYYIBAH GRID */
.toy-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(140px,40vw,200px),1fr));
  gap:12px;padding:8px 14px 36px;max-width:520px;margin:0 auto;
  position:relative;z-index:10;
}
.toy-card{
  border-radius:24px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:5px;
  cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.13),0 2px 16px rgba(0,0,0,.09);
  border:4px solid rgba(255,255,255,.5);transition:transform .1s;user-select:none;
  animation:cardIn .45s cubic-bezier(.34,1.56,.64,1) both;position:relative;text-align:center;
}
.toy-card:active{transform:scale(.93)}
.toy-card.done::after{content:'⭐';position:absolute;top:-7px;right:-5px;font-size:.9rem}
.toy-icon{font-size:clamp(1.8rem,6vw,2.5rem);line-height:1}
.toy-arab{font-size:clamp(1.3rem,4.5vw,1.9rem);color:white;font-family:serif;text-shadow:2px 4px 0 rgba(0,0,0,.18);line-height:1.4;direction:rtl}
.toy-latin{font-family:'Fredoka One',cursive;font-size:clamp(.7rem,2.4vw,.9rem);color:rgba(255,255,255,.95);letter-spacing:.3px}
.toy-arti{font-size:clamp(.58rem,1.9vw,.72rem);color:rgba(255,255,255,.82);font-weight:800;font-style:italic}

/* ══ OVERLAY ══ */
#overlay{
  position:fixed;inset:0;z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  overflow:hidden;
}
#overlay.active{display:flex}

.ov-deco{position:absolute;pointer-events:none;opacity:.15;font-size:3.5rem;animation:decoF 4s ease-in-out infinite}
.ov-deco:nth-child(1){top:4%;left:4%}.ov-deco:nth-child(2){top:5%;right:5%;animation-delay:1s;font-size:2.5rem}
.ov-deco:nth-child(3){bottom:6%;left:6%;animation-delay:2s;font-size:2.8rem}.ov-deco:nth-child(4){bottom:5%;right:4%;animation-delay:.5s;font-size:2rem}
@keyframes decoF{0%,100%{transform:translateY(0)rotate(0)}50%{transform:translateY(-14px)rotate(10deg)}}

/* close hint — always visible at top */
.ov-close-hint{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  z-index:10;
  background:rgba(0,0,0,.18);
  border-radius:99px;padding:7px 20px;
  font-size:clamp(.72rem,2.4vw,.88rem);color:white;font-weight:700;
  white-space:nowrap;cursor:pointer;
  border:2px solid rgba(255,255,255,.35);
}

/* ABC overlay */
#ovABC{display:none;flex-direction:column;align-items:center;width:100%;gap:8px;cursor:pointer}
.ov-emoji{font-size:clamp(10rem,40vw,20rem);line-height:1.05;display:block;text-align:center;filter:drop-shadow(0 24px 42px rgba(0,0,0,.24));animation:emojiIn .55s cubic-bezier(.34,1.56,.64,1) both,bigFloat 3.5s 1s ease-in-out infinite}
.ov-abc-row{display:flex;align-items:center;gap:12px}
.ov-badge{width:clamp(52px,13vw,76px);height:clamp(52px,13vw,76px);border-radius:50%;background:rgba(255,255,255,.28);border:4px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-family:'Fredoka One',cursive;font-size:clamp(1.6rem,6vw,2.6rem);color:white;text-shadow:3px 4px 0 rgba(0,0,0,.14)}
.ov-badge.lo{background:rgba(0,0,0,.14)}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.5)}
.ov-word{background:white;border-radius:99px;padding:9px 28px;font-size:clamp(1.2rem,5vw,1.8rem);font-weight:800;color:#2D2D2D;box-shadow:0 6px 24px rgba(0,0,0,.12);border:3px solid #F0E6FF}
.ov-word .wl{font-family:'Fredoka One',cursive}

/* HIJ overlay */
#ovHIJ{display:none;flex-direction:column;align-items:center;width:100%;gap:8px;cursor:pointer}
.ov-hij-ltr{font-size:clamp(10rem,40vw,20rem);line-height:1;color:white;text-shadow:6px 10px 0 rgba(0,0,0,.16);font-family:serif;animation:emojiIn .55s cubic-bezier(.34,1.56,.64,1) both,bigFloat 3.5s 1s ease-in-out infinite}
.ov-hij-name{font-family:'Fredoka One',cursive;font-size:clamp(1.4rem,5.5vw,2.2rem);color:white;background:rgba(255,255,255,.22);border-radius:99px;padding:8px 30px;border:3px solid rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase}
.harakat-row{display:flex;gap:10px}
.hcard{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.22);border:3px solid rgba(255,255,255,.5);border-radius:20px;padding:10px 14px;cursor:pointer;transition:transform .1s,background .1s;min-width:clamp(64px,16vw,90px)}
.hcard:active,.hcard.on{background:rgba(255,255,255,.42);transform:scale(1.08)}
.hcard-arab{font-size:clamp(2.3rem,8vw,3.5rem);color:white;line-height:1.1;text-shadow:3px 5px 0 rgba(0,0,0,.15);font-family:serif}
.hcard-lat{font-family:'Fredoka One',cursive;font-size:clamp(.8rem,2.7vw,1rem);color:rgba(255,255,255,.92);margin-top:3px;letter-spacing:1px}
.hcard-dot{font-size:.9rem;margin-top:2px}

/* TOY overlay */
#ovTOY{display:none;flex-direction:column;align-items:center;width:100%;gap:10px;padding:0 14px;cursor:pointer}
.ov-toy-icon{font-size:clamp(5rem,18vw,9rem);line-height:1;animation:emojiIn .55s cubic-bezier(.34,1.56,.64,1) both,bigFloat 3.5s 1s ease-in-out infinite;filter:drop-shadow(0 16px 30px rgba(0,0,0,.22))}
.ov-toy-arab{font-size:clamp(1.8rem,7vw,3.5rem);color:white;font-family:serif;text-shadow:4px 8px 0 rgba(0,0,0,.18);line-height:1.5;direction:rtl;text-align:center;max-width:90vw;animation:fadeUp .4s .1s ease both}
.ov-toy-latin{font-family:'Fredoka One',cursive;font-size:clamp(1rem,4vw,1.6rem);color:white;background:rgba(255,255,255,.2);border-radius:99px;padding:7px 24px;border:3px solid rgba(255,255,255,.45);animation:fadeUp .4s .2s ease both;letter-spacing:.5px}
.ov-toy-arti{font-size:clamp(.82rem,2.8vw,1rem);color:rgba(255,255,255,.92);font-style:italic;font-weight:800;text-align:center;padding:0 20px;animation:fadeUp .4s .3s ease both}
.ov-toy-kapan{font-size:clamp(.66rem,2.1vw,.82rem);color:rgba(255,255,255,.75);font-weight:700;background:rgba(0,0,0,.14);border-radius:99px;padding:5px 16px;animation:fadeUp .4s .4s ease both;text-align:center;max-width:88vw}

/* ubay corner */
.ov-ubay{position:absolute;bottom:14px;right:14px;width:clamp(50px,12vw,70px);z-index:2}
.ov-ubay img{width:100%;border-radius:50%;border:4px solid white;box-shadow:0 6px 18px rgba(0,0,0,.2);display:block;object-fit:cover;aspect-ratio:1}

@keyframes emojiIn{from{transform:scale(.15)rotate(-15deg);opacity:0}to{transform:scale(1)rotate(0);opacity:1}}
@keyframes bigFloat{0%,100%{transform:translateY(0)scale(1)}50%{transform:translateY(-26px)scale(1.07)}}

/* CONFETTI */
.cwrap{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.cp{position:absolute;top:-24px;border-radius:4px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh)rotate(760deg);opacity:0}}

/* CELEBRATE */
.celwrap{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}
.celwrap.show{opacity:1}
.cel-txt{font-family:'Fredoka One',cursive;font-size:clamp(2.5rem,12vw,5.5rem);background:linear-gradient(135deg,#FF6B6B,#FFD93D,#4ECDC4,#A78BFA);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-align:center;padding:0 20px;animation:popIn .42s cubic-bezier(.34,1.56,.64,1) both}
</style>
</head>
<body>

<div class="bubbles"><div class="bbl"></div><div class="bbl"></div><div class="bbl"></div><div class="bbl"></div><div class="bbl"></div></div>
<div class="cwrap" id="cwrap"></div>
<div class="celwrap" id="celwrap"><div class="cel-txt" id="celTxt">Hebat! 🌟</div></div>

<!-- ════ SPLASH ════ -->
<div id="splash" class="screen active">
  <div class="sp-stars" id="spStars"></div>
  <div class="sp-title">🌈 Halo Ubay!<br>Mau belajar apa hari ini?</div>
  <img class="sp-photo" id="spPhoto" src="" alt="Ubay">
  <div class="sp-tag">✨ Pilih yuk sayang~ ✨</div>
  <div class="sp-choices">
    <button class="sp-btn abc" onclick="startMode('abc')">
      <div class="sp-btn-icon">🔤</div>
      <div class="sp-btn-title">Alphabet</div>
      <div class="sp-btn-sub">A B C • 26 Huruf</div>
    </button>
    <button class="sp-btn hij" onclick="startMode('hij')">
      <div class="sp-btn-icon">🌙</div>
      <div class="sp-btn-title">Hijaiyah</div>
      <div class="sp-btn-sub">ا ب ت • 28 Huruf</div>
    </button>
    <button class="sp-btn toy" onclick="startMode('toy')">
      <div class="sp-btn-icon">🤲</div>
      <div class="sp-btn-title">Thoyyibah</div>
      <div class="sp-btn-sub">10 Kalimat</div>
    </button>
  </div>
</div>

<!-- ════ APP ════ -->
<div id="appScreen" class="screen">
  <div class="app-header">
    <button class="back-btn" onclick="goHome()">← Pilih Lagi</button>
    <span class="app-mascot" id="appMascot">🦋</span>
    <span class="app-title" id="appTitle">Taman Huruf Ubay</span>
    <div class="app-sub" id="appSub">Sentuh hurufnya!</div>
  </div>
  <div class="prog-wrap">
    <div class="star-badge" id="starBadge">⭐ 0</div>
    <div class="prog-track" id="progTrack"><div class="prog-fill" id="progFill"></div></div>
  </div>

  <!-- Letter layout (ABC & HIJ) -->
  <div id="letterLayout">
    <div class="letter-stage">
      <div class="center-stage">
        <div class="letter-cols" id="letterCols"></div>
        <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:clamp(88px,23vw,136px);z-index:1;pointer-events:none">
          <div class="ubay-mid"><img id="ubayMid" src="" alt="Ubay"></div>
        </div>
      </div>
    </div>
    <div class="tap-hint" id="tapHint">👆 Sentuh hurufnya!</div>
    <div class="bottom-row" id="bottomRow"></div>
  </div>

  <!-- Thoyyibah layout -->
  <div id="toyLayout" style="display:none">
    <div class="tap-hint toy" style="margin-top:4px">👆 Sentuh kalimatnya!</div>
    <div class="toy-grid" id="toyGrid"></div>
  </div>
</div>

/* ══ SPEECH ══ */
let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked)return; audioUnlocked=true;
  const u=new SpeechSynthesisUtterance('');u.volume=0;
  window.speechSynthesis?.speak(u);
}
['touchstart','mousedown'].forEach(e=>document.addEventListener(e,unlockAudio,{once:true,passive:true}));
if(window.speechSynthesis){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
}
function speak(text,rate=0.75,pitch=1.3){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const go=()=>{
    const u=new SpeechSynthesisUtterance(text);
    u.lang='id-ID';u.rate=rate;u.pitch=pitch;u.volume=1;
    const vs=window.speechSynthesis.getVoices();
    const v=vs.find(x=>x.lang.startsWith('id'))||vs.find(x=>x.lang.startsWith('ms'))||vs[0];
    if(v)u.voice=v;
    window.speechSynthesis.speak(u);
  };
  window.speechSynthesis.getVoices().length>0?go():(window.speechSynthesis.onvoiceschanged=()=>{window.speechSynthesis.onvoiceschanged=null;go();});
}
function speakChain(texts,rates,pitches,i=0){
  if(i>=texts.length)return;
  if(!window.speechSynthesis)return;
  if(i===0)window.speechSynthesis.cancel();
  const go=()=>{
    const u=new SpeechSynthesisUtterance(texts[i]);
    u.lang='id-ID';u.rate=rates[i]||.75;u.pitch=pitches[i]||1.3;u.volume=1;
    const vs=window.speechSynthesis.getVoices();
    const v=vs.find(x=>x.lang.startsWith('id'))||vs.find(x=>x.lang.startsWith('ms'))||vs[0];
    if(v)u.voice=v;
    u.onend=()=>speakChain(texts,rates,pitches,i+1);
    window.speechSynthesis.speak(u);
  };
  window.speechSynthesis.getVoices().length>0?go():(window.speechSynthesis.onvoiceschanged=()=>{window.speechSynthesis.onvoiceschanged=null;go();});
}
function playAudio(filename,fallbackFn){
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null;}
  window.speechSynthesis?.cancel();
  const a=new Audio(AUDIO_BASE+filename);
  a.volume=1;currentAudio=a;
  a.play().catch(()=>{ if(fallbackFn)fallbackFn(); });
}
function stopAudio(){
  if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null;}
  window.speechSynthesis?.cancel();
}

/* ══ SPLASH STARS ══ */
(function(){
  const c=document.getElementById('spStars');
  ['⭐','🌟','✨','💫','🌙','🌈','🎈','🕌'].forEach(ic=>{
    for(let i=0;i<2;i++){
      const s=document.createElement('div');s.className='sstar';
      s.textContent=ic;
      s.style.cssText=`left:${Math.random()*92}%;top:${Math.random()*88}%;animation-delay:${Math.random()*2}s;font-size:${Math.random()*1+.7}rem`;
      c.appendChild(s);
    }
  });
})();

/* ══ NAVIGATION ══ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){
  stopAudio();
  closeOverlay();
  showScreen('splash');
  // reset
  document.getElementById('letterCols').innerHTML='';
  document.getElementById('bottomRow').innerHTML='';
  document.getElementById('toyGrid').innerHTML='';
  document.getElementById('progFill').style.width='0%';
  document.getElementById('starBadge').textContent='⭐ 0';
  learned=new Set();mode=null;
}

function startMode(m){
  unlockAudio();
  mode=m; learned=new Set();
  showScreen('appScreen');

  // header
  const mascot=m==='abc'?'🦋':m==='hij'?'🌙':'🤲';
  const title=m==='abc'?'Alphabet Ubay':m==='hij'?'Hijaiyah Ubay':'Kalimat Thoyyibah';
  document.getElementById('appMascot').textContent=mascot;
  document.getElementById('appTitle').textContent=' '+title;
  document.getElementById('appSub').className='app-sub '+m;
  document.getElementById('appSub').textContent=m==='toy'?'Sentuh kalimatnya! ✨':'Sentuh hurufnya! ✨';
  document.getElementById('progTrack').className='prog-track '+m;
  document.getElementById('progFill').className='prog-fill '+m;
  document.getElementById('progFill').style.width='0%';
  document.getElementById('starBadge').textContent='⭐ 0';

  // show/hide layouts
  document.getElementById('letterLayout').style.display=m==='toy'?'none':'block';
  document.getElementById('toyLayout').style.display=m==='toy'?'block':'none';
  document.getElementById('tapHint') && (document.getElementById('tapHint').className='tap-hint '+m);

  // greet
  const greet=m==='abc'?'Halo Ubay! Ayo belajar huruf Alphabet!':m==='hij'?'Halo Ubay! Ayo belajar huruf Hijaiyah!':'Halo Ubay! Ayo belajar kalimat thoyyibah!';
  speak(greet,.78,1.25);

  // build
  if(m==='abc') buildABC();
  else if(m==='hij') buildHIJ();
  else buildTOY();
}

/* ══ BUILD ABC ══ */
function buildABC(){
  const cols=document.getElementById('letterCols');
  const bot=document.getElementById('bottomRow');
  cols.innerHTML='';bot.innerHTML='';
  const colL=document.createElement('div');colL.className='col-l';
  const colC=document.createElement('div');colC.className='col-c';
  const colR=document.createElement('div');colR.className='col-r';
  ABC.slice(0,5).forEach((_,i)=>colL.appendChild(makeABCCard(i,'lcard')));
  ABC.slice(5,10).forEach((_,i)=>colR.appendChild(makeABCCard(i+5,'lcard')));
  cols.appendChild(colL);cols.appendChild(colC);cols.appendChild(colR);
  ABC.slice(10).forEach((_,i)=>bot.appendChild(makeABCCard(i+10,'bcard')));
}
function makeABCCard(idx,cls){
  const d=ABC[idx];
  const el=document.createElement('div');
  el.className=cls;el.id='c-abc-'+idx;
  el.style.background=grad(d.c);
  el.style.animationDelay=(idx*.03)+'s';
  if(cls==='lcard'){
    el.innerHTML=`<div class="emoji">${d.e}</div><div class="info"><div class="ltr">${d.l}</div><div class="wrd">${d.w}</div></div>`;
  } else {
    el.innerHTML=`<div class="emoji">${d.e}</div><div class="ltr">${d.l}</div>`;
  }
  el.onclick=()=>openOverlayABC(idx);
  return el;
}

/* ══ BUILD HIJ ══ */
function buildHIJ(){
  const cols=document.getElementById('letterCols');
  const bot=document.getElementById('bottomRow');
  cols.innerHTML='';bot.innerHTML='';
  const colL=document.createElement('div');colL.className='col-l';
  const colC=document.createElement('div');colC.className='col-c';
  const colR=document.createElement('div');colR.className='col-r';
  HIJ.slice(0,5).forEach((_,i)=>colL.appendChild(makeHIJCard(i,'lcard')));
  HIJ.slice(5,10).forEach((_,i)=>colR.appendChild(makeHIJCard(i+5,'lcard')));
  cols.appendChild(colL);cols.appendChild(colC);cols.appendChild(colR);
  HIJ.slice(10).forEach((_,i)=>bot.appendChild(makeHIJCard(i+10,'bcard')));
}
function makeHIJCard(idx,cls){
  const d=HIJ[idx];
  const el=document.createElement('div');
  el.className=cls;el.id='c-hij-'+idx;
  el.style.background=grad(d.c);
  el.style.animationDelay=(idx*.03)+'s';
  if(cls==='lcard'){
    el.innerHTML=`<div class="arab">${d.arab}</div><div class="ainfo"><div class="aname">${d.name}</div></div>`;
  } else {
    el.innerHTML=`<div class="arab">${d.arab}</div><div class="aname">${d.name}</div>`;
  }
  el.onclick=()=>openOverlayHIJ(idx);
  return el;
}

/* ══ BUILD TOY ══ */
function buildTOY(){
  const grid=document.getElementById('toyGrid');
  grid.innerHTML='';
  TOY.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='toy-card';el.id='c-toy-'+i;
    el.style.background=grad(d.c);
    el.style.animationDelay=(i*.06)+'s';
    el.innerHTML=`<div class="toy-icon">${d.icon}</div><div class="toy-arab">${d.arab}</div><div class="toy-latin">${d.latin}</div><div class="toy-arti">${d.arti}</div>`;
    el.onclick=()=>openOverlayTOY(i);
    grid.appendChild(el);
  });
}

/* ══ OVERLAY OPEN ══ */
function showOverlay(bg,decos){
  const ov=document.getElementById('overlay');
  ov.style.background=bg;
  ['deco1','deco2','deco3','deco4'].forEach((id,i)=>document.getElementById(id).textContent=decos[i]);
  document.getElementById('ovABC').style.display='none';
  document.getElementById('ovHIJ').style.display='none';
  document.getElementById('ovTOY').style.display='none';
  ov.style.animation='none';void ov.offsetWidth;
  ov.style.animation='ovIn .35s ease both';
  ov.style.display='flex';
}
function openOverlayABC(idx){
  const d=ABC[idx];
  showOverlay(grad(d.c),['🌟','✨','⭐','💫']);
  document.getElementById('ovABC').style.display='flex';
  const em=document.getElementById('ovEmoji');
  em.textContent=d.e;
  em.style.animation='none';void em.offsetWidth;
  em.style.animation='emojiIn .55s cubic-bezier(.34,1.56,.64,1) both,bigFloat 3.5s 1s ease-in-out infinite';
  document.getElementById('ovLetU').textContent=d.l.toUpperCase();
  document.getElementById('ovLetL').textContent=d.l.toLowerCase();
  const wl=document.getElementById('ovWL');
  wl.textContent=d.l;wl.style.color=d.c[0];
  document.getElementById('ovWR').textContent=d.w.slice(1).toLowerCase();
  speakChain(['Huruf '+d.l,d.w],[.74,.76],[1.3,1.25]);
  markLearned('abc',idx,ABC.length);
}
function openOverlayHIJ(idx){
  const d=HIJ[idx];
  showOverlay(grad(d.c),['🌙','⭐','✨','🌟']);
  document.getElementById('ovHIJ').style.display='flex';
  const hl=document.getElementById('ovHijLtr');
  hl.textContent=d.arab;
  hl.style.animation='none';void hl.offsetWidth;
  hl.style.animation='emojiIn .55s cubic-bezier(.34,1.56,.64,1) both,bigFloat 3.5s 1s ease-in-out infinite';
  document.getElementById('ovHijName').textContent=d.name.toUpperCase();
  const row=document.getElementById('harakatRow');row.innerHTML='';
  [{lbl:d.f,lat:d.s[0],dot:'🔴'},{lbl:d.k,lat:d.s[1],dot:'🟢'},{lbl:d.d,lat:d.s[2],dot:'🔵'}].forEach(h=>{
    const hc=document.createElement('div');hc.className='hcard';
    hc.innerHTML=`<div class="hcard-arab">${h.lbl}</div><div class="hcard-lat">${h.lat.toUpperCase()}</div><div class="hcard-dot">${h.dot}</div>`;
    hc.onclick=e=>{e.stopPropagation();document.querySelectorAll('.hcard').forEach(x=>x.classList.remove('on'));hc.classList.add('on');speak(h.lat,.7,1.35);};
    row.appendChild(hc);
  });
  speakChain([d.name,d.s[0]],[.72,.70],[1.3,1.35]);
  markLearned('hij',idx,HIJ.length);
}
function openOverlayTOY(idx){
  const d=TOY[idx];
  showOverlay(grad(d.c),['🌙','⭐','✨','🤲']);
  document.getElementById('ovTOY').style.display='flex';
  const ic=document.getElementById('ovToyIcon');
  ic.textContent=d.icon;
  ic.style.animation='none';void ic.offsetWidth;
  ic.style.animation='emojiIn .55s cubic-bezier(.34,1.56,.64,1) both,bigFloat 3.5s 1s ease-in-out infinite';
  document.getElementById('ovToyArab').textContent=d.arab;
  document.getElementById('ovToyLatin').textContent=d.latin;
  document.getElementById('ovToyArti').textContent=d.arti;
  document.getElementById('ovToyKapan').textContent='📖 '+d.kapan;
  // Play real audio, fallback to speech
  playAudio(d.audio, ()=>speak(d.latin,.68,1.2));
  markLearned('toy',idx,TOY.length);
}

/* ══ CLOSE OVERLAY ══ */
function closeOverlay(){
  stopAudio();
  const ov=document.getElementById('overlay');
  ov.style.display='none';
}
// tap anywhere on overlay (outside content) = close
document.getElementById('overlay').addEventListener('click',function(e){
  // only close if clicking the background, not child interactive elements
  if(e.target===this || e.target.classList.contains('ov-close-hint')){
    closeOverlay();
  }
});

/* ══ MARK LEARNED ══ */
function markLearned(type,idx,total){
  const key=type+'-'+idx;
  setTimeout(()=>{
    if(!learned.has(key)){
      learned.add(key);
      document.getElementById('c-'+type+'-'+idx)?.classList.add('done');
      celebrate();
      document.getElementById('progFill').style.width=(learned.size/total*100)+'%';
      document.getElementById('starBadge').textContent='⭐ '+learned.size;
    }
  },1800);
}

/* ══ CELEBRATE ══ */
function celebrate(){
  const msg=CHEERS[Math.floor(Math.random()*CHEERS.length)];
  document.getElementById('celTxt').textContent=msg;
  const el=document.getElementById('celwrap');
  el.classList.add('show');spawnConfetti();
  setTimeout(()=>el.classList.remove('show'),1600);
}
function spawnConfetti(){
  const wrap=document.getElementById('cwrap');
  const cols=['#FF6B6B','#FFD93D','#4ECDC4','#A78BFA','#FF9A9E','#81ECEC','#FFA07A','#66BB6A'];
  for(let i=0;i<90;i++){
    const p=document.createElement('div');p.className='cp';
    const sz=Math.random()*15+7;
    p.style.cssText=`width:${sz}px;height:${sz*(Math.random()>.5?1:2.5)}px;background:${cols[~~(Math.random()*cols.length)]};left:${Math.random()*100}%;border-radius:${Math.random()>.5?'50%':'4px'};animation-duration:${Math.random()*1.6+1}s;animation-delay:${Math.random()*.5}s;`;
    wrap.appendChild(p);setTimeout(()=>p.remove(),2800);
  }
}
</script>
